    <title>Cardapio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lanchonete do Joel</h1>

    </header>
    <main>
        <section class="card">
            <h2>X-Burger</h2>
            <p>Pão, hamburguer e queijo</p>
            <span class="valor">R$ 30,00</span>
        </section>
        <section class="card destaque">
            <h2>X-Salada</h2>
            <p>Pão, hamburger, tomate e salada</p>
            <span class="valor">R$ 25,00</span>
        </section>
        <section class="card">
            <h2>X-Egg</h2>
            <p>Pão, hamburger, bacon e ovos</p>
            <span class="valor">R$ 25,00</span>
        </section>
    </main>
    <footer>Pedidos: (61)9998623793</footer>
</body>
</html>
