<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardapio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="topo">
        <h1>Lanchonete do Joel</h1>
        <p>Cardápio de hoje</p>
    </header>
    <main>
        <section class="card">
            <h2>X-Burger</h2>
            <p>Pão, hamburguer, queijo, bacon, alface, tomate, presunto e ovo</p>
            <span class="valor">R$ 35,00</span>
        </section>
        <section class="card destaque">
            <h2>X-Salada</h2>
            <p>Pão, hamburger, tomate e alface</p>
            <span class="valor">R$ 25,00</span>
        </section>
        <section class="card">
            <h2>X-Egg</h2>
            <p>Pão, hamburger, bacon e ovos</p>
            <span class="valor">R$ 25,00</span>
        </section>
        <section class="card">
            <h2>Hot-dog</h2>
            <p>Pão, salsicha e batata palha</p>
            <span class="valor">R$ 20,00</span>
        </section>
    </main>
    <footer id="contato">Pedidos: (61) 99986-23793</footer>
</body>
</html>
